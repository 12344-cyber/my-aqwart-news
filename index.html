<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صندوق تكافل اجتماعي - أهل لفريگ أفريگ حمادي</title>
<style>
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#f0f4f8;margin:0;color:#222;}
  header{background:linear-gradient(135deg,#2e8b57,#1f6b40);color:#fff;padding:18px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.15);}
  header h1{margin:0;font-size:20px;}
  header p{margin:4px 0 0;font-size:13px;opacity:.9;}
  nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px;background:#fff;border-bottom:1px solid #ddd;}
  nav button{padding:8px 14px;border:none;border-radius:20px;background:#e8f1ec;color:#2e8b57;cursor:pointer;font-weight:bold;font-size:14px;}
  nav button.active{background:#2e8b57;color:#fff;}
  main{max-width:700px;margin:16px auto;padding:0 12px 40px;}
  .card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
  .stat{display:flex;justify-content:space-between;align-items:center;font-size:16px;margin:6px 0;}
  .stat .big{font-size:22px;font-weight:bold;color:#2e8b57;}
  label{display:block;margin:10px 0 4px;font-size:14px;color:#444;}
  input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:15px;font-family:inherit;}
  input[type=file]{padding:6px;}
  button.primary{background:#2e8b57;color:#fff;border:none;padding:12px;border-radius:8px;font-size:15px;cursor:pointer;width:100%;margin-top:10px;}
  button.primary:hover{background:#256d45;}
  button.danger{background:#c0392b;}
  button.secondary{background:#6c757d;}
  .member{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;cursor:pointer;border:1px solid #eee;margin-bottom:8px;background:#fff;}
  .member:hover{border-color:#2e8b57;background:#f8fdf9;}
  .member img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#eee;flex-shrink:0;}
  .member .avatar-sm{width:48px;height:48px;border-radius:50%;background:#e8f1ec;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
  .member .info{flex:1;min-width:0;}
  .member .info b{display:block;font-size:15px;}
  .member .info small{color:#666;font-size:12px;}
  .avatar{width:90px;height:90px;border-radius:50%;object-fit:cover;background:#e8f1ec;display:block;margin:0 auto 10px;}
  .avatar-big{width:90px;height:90px;border-radius:50%;background:#e8f1ec;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 10px;}
  .row{display:flex;gap:8px;}
  .row>*{flex:1;}
  .item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #eee;font-size:14px;}
  .item:last-child{border-bottom:none;}
  .empty{color:#888;font-size:14px;text-align:center;padding:12px;}
  .hidden{display:none !important;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2e8b57;color:#fff;padding:10px 22px;border-radius:30px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;font-size:14px;}
  .toast.show{opacity:1;}
  textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-family:monospace;font-size:13px;min-height:200px;resize:vertical;}
</style>
</head>
<body>

<header>
  <h1>صندوق تكافل اجتماعي</h1>
  <p>جماعة أهل لفريگ أفريگ حمادي</p>
</header>

<nav>
  <button data-view="home"    onclick="showView('home')">🏠 الرئيسية</button>
  <button data-view="add"     onclick="showView('add')">➕ إضافة فرد</button>
  <button data-view="members" onclick="showView('members')">👥 الأفراد</button>
  <button data-view="stats"   onclick="showView('stats')">📊 الإحصائيات</button>
</nav>

<main>
  <!-- الرئيسية -->
  <section id="view-home">
    <div class="card">
      <h3 style="margin-top:0">مرحباً بكم</h3>
      <p style="margin:0;color:#555;font-size:14px;">نظام إدارة اشتراكات الأفراد في الصندوق.</p>
    </div>
    <div class="card stat"><span>👥 عدد الأفراد</span><span class="big" id="homeCount">0</span></div>
    <div class="card stat"><span>💰 مجموع الاشتراكات</span><span class="big" id="homeSubs">0</span></div>
  </section>

  <!-- إضافة فرد -->
  <section id="view-add" class="hidden">
    <div class="card">
      <h3 style="margin-top:0">➕ إضافة فرد</h3>
      <label>الاسم الكامل</label>
      <input id="inName" placeholder="مثال: أحمد محمد">
      <label>رقم العضو</label>
      <input id="inNumber" placeholder="مثال: 001">
      <label>تاريخ الانتساب</label>
      <input type="date" id="inDate">
      <label>صورة (اختياري)</label>
      <input type="file" id="inPhoto" accept="image/*">
      <button class="primary" onclick="addMember()">💾 حفظ</button>
    </div>
  </section>

  <!-- قائمة الأفراد -->
  <section id="view-members" class="hidden">
    <div class="card">
      <h3 style="margin-top:0">👥 قائمة الأفراد</h3>
      <input id="searchBox" placeholder="🔍 بحث بالاسم أو الرقم..." oninput="renderMembers()">
    </div>
    <div id="membersList"></div>
  </section>

  <!-- الملف الشخصي -->
  <section id="view-profile" class="hidden">
    <div class="card" id="profileInfo"></div>

    <div class="card">
      <h4 style="margin-top:0">💰 الاشتراكات</h4>
      <div id="profileSubs"></div>
      <div class="row" style="margin-top:10px">
        <input id="subAmount" type="number" placeholder="المبلغ" value="100">
        <select id="subType">
          <option value="شهري">شهري</option>
          <option value="سنوي">سنوي</option>
        </select>
      </div>
      <button class="primary" onclick="addSub()">➕ إضافة اشتراك</button>
    </div>

    <div class="card">
      <button class="primary danger" onclick="deleteMember()">🗑️ حذف هذا الفرد</button>
    </div>
    <button class="primary secondary" onclick="showView('members')">⬅ رجوع للقائمة</button>
  </section>

  <!-- الإحصائيات -->
  <section id="view-stats" class="hidden">
    <div class="card">
      <h3 style="margin-top:0">📊 الإحصائيات</h3>
      <div class="stat"><span>👥 عدد الأفراد</span><span class="big" id="statCount">0</span></div>
      <div class="stat"><span>💰 مجموع الاشتراكات</span><span class="big" id="statSubs">0</span></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">📋 كل الاشتراكات</h3>
      <textarea id="allSubsText" readonly></textarea>
      <button class="primary" onclick="copyAll()">📋 نسخ الكل</button>
    </div>

    <div class="card">
      <button class="primary secondary" onclick="resetAll()">⚠️ حذف جميع البيانات</button>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
/* ==================== البيانات ==================== */
const STORAGE_KEY = 'takaful_members_ahl_lfrig';
let members = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let currentIndex = -1;

/* أرقام بالفرنسية (غربية) */
function fmt(n){ return Number(n).toLocaleString('fr-FR'); }

/* ==================== أدوات ==================== */
function toast(msg, ok=true){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = ok ? '#2e8b57' : '#c0392b';
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(members)); }

/* ==================== التنقل ==================== */
function showView(v){
  ['home','add','members','profile','stats'].forEach(id=>{
    const el = document.getElementById('view-'+id);
    if(el) el.classList.toggle('hidden', id!==v);
  });
  document.querySelectorAll('nav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.view === v);
  });
  if(v==='members') renderMembers();
  if(v==='home') refreshStats();
  if(v==='stats'){ refreshStats(); buildAllSubsText(); }
  if(v==='profile') renderProfile();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ==================== الإحصائيات ==================== */
function refreshStats(){
  let subs = 0;
  members.forEach(m=>{
    (m.subscriptions || []).forEach(s => subs += Number(s.amount) || 0);
  });
  const set = (id,val)=>{ const e=document.getElementById(id); if(e) e.innerText=val; };
  set('homeCount', fmt(members.length));
  set('homeSubs', fmt(subs));
  set('statCount', fmt(members.length));
  set('statSubs', fmt(subs));
}

/* ==================== إضافة فرد ==================== */
function addMember(){
  const name   = document.getElementById('inName').value.trim();
  const number = document.getElementById('inNumber').value.trim();
  const date   = document.getElementById('inDate').value;
  const photoFile = document.getElementById('inPhoto').files[0];

  if(!name || !number){ toast('يرجى ملء الاسم والرقم', false); return; }
  if(members.some(m => m.number === number)){
    toast('رقم العضو مستخدم مسبقاً', false); return;
  }

  const finish = (photoData) => {
    members.push({
      name, number,
      date: date || new Date().toISOString().slice(0,10),
      photo: photoData || '',
      subscriptions: []
    });
    saveData();
    document.getElementById('inName').value = '';
    document.getElementById('inNumber').value = '';
    document.getElementById('inDate').value = '';
    document.getElementById('inPhoto').value = '';
    toast('✅ تمت إضافة الفرد بنجاح');
    showView('members');
  };

  if(photoFile){
    const reader = new FileReader();
    reader.onload = e => finish(e.target.result);
    reader.readAsDataURL(photoFile);
  } else {
    finish('');
  }
}

/* ==================== قائمة الأفراد ==================== */
function renderMembers(){
  const box = document.getElementById('membersList');
  const q = (document.getElementById('searchBox').value || '').trim();
  const filtered = members.map((m,i)=>({m,i})).filter(({m})=>{
    if(!q) return true;
    return m.name.includes(q) || (m.number||'').includes(q);
  });

  if(!filtered.length){
    box.innerHTML = '<div class="card empty">لا توجد أفراد مسجلون بعد</div>';
    return;
  }
  box.innerHTML = filtered.map(({m,i})=>`
    <div class="member" onclick="openProfile(${i})">
      ${m.photo
        ? `<img src="${m.photo}" alt="">`
        : `<div class="avatar-sm">👤</div>`}
      <div class="info">
        <b>${m.name}</b>
        <small>رقم: ${m.number} &nbsp;|&nbsp; انتساب: ${m.date || '-'}</small>
      </div>
    </div>
  `).join('');
}

/* ==================== الملف الشخصي ==================== */
function openProfile(i){
  currentIndex = i;
  showView('profile');
}

function renderProfile(){
  const m = members[currentIndex];
  if(!m){ showView('members'); return; }

  document.getElementById('profileInfo').innerHTML = `
    ${m.photo
      ? `<img class="avatar" src="${m.photo}" alt="">`
      : `<div class="avatar-big">👤</div>`}
    <h3 style="text-align:center;margin:6px 0">${m.name}</h3>
    <div class="stat"><span>رقم العضو</span><b>${m.number}</b></div>
    <div class="stat"><span>تاريخ الانتساب</span><b>${m.date || '-'}</b></div>
  `;

  const subsBox = document.getElementById('profileSubs');
  if(!m.subscriptions || !m.subscriptions.length){
    subsBox.innerHTML = '<div class="empty">لا توجد اشتراكات</div>';
  } else {
    subsBox.innerHTML = m.subscriptions.map(s=>`
      <div class="item">
        <span>${s.type || 'اشتراك'} — ${s.date}</span>
        <span><b>${fmt(s.amount)}</b> أوقية</span>
      </div>
    `).join('');
  }
}

/* ==================== إضافة اشتراك ==================== */
function addSub(){
  const amount = Number(document.getElementById('subAmount').value);
  const type   = document.getElementById('subType').value;
  if(!amount || amount <= 0){ toast('أدخل مبلغاً صحيحاً', false); return; }

  const m = members[currentIndex];
  m.subscriptions = m.subscriptions || [];
  m.subscriptions.push({
    amount, type,
    date: new Date().toLocaleDateString('fr-FR')
  });
  saveData();
  renderProfile();
  refreshStats();
  toast('✅ تمت إضافة الاشتراك');
}

/* ==================== حذف ==================== */
function deleteMember(){
  if(!confirm('هل تريد حذف هذا الفرد وجميع اشتراكاته نهائياً؟')) return;
  members.splice(currentIndex, 1);
  saveData();
  refreshStats();
  showView('members');
  toast('🗑️ تم الحذف');
}

/* ==================== نص كل الاشتراكات ==================== */
function buildAllSubsText(){
  let out = 'قائمة اشتراكات الأفراد\n';
  out += '====================\n';
  let total = 0;
  members.forEach(m=>{
    out += `\n👤 ${m.name} (رقم: ${m.number})\n`;
    if(!m.subscriptions || !m.subscriptions.length){
      out += '   - لا توجد اشتراكات\n';
    } else {
      m.subscriptions.forEach(s=>{
        out += `   - ${s.type || 'اشتراك'} | ${s.date} | ${fmt(s.amount)} أوقية\n`;
        total += Number(s.amount) || 0;
      });
    }
  });
  out += '\n====================\n';
  out += `المجموع الكلي: ${fmt(total)} أوقية\n`;
  out += `عدد الأفراد: ${fmt(members.length)}\n`;
  document.getElementById('allSubsText').value = out;
}

function copyAll(){
  const txt = document.getElementById('allSubsText').value;
  if(!txt){ toast('لا يوجد نص لنسخه', false); return; }

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>{
      toast('📋 تم نسخ كل الاشتراكات');
    }).catch(()=>{
      // بديل
      const ta = document.getElementById('allSubsText');
      ta.select();
      document.execCommand('copy');
      toast('📋 تم النسخ');
    });
  } else {
    const ta = document.getElementById('allSubsText');
    ta.select();
    document.execCommand('copy');
    toast('📋 تم النسخ');
  }
}

/* ==================== حذف الكل ==================== */
function resetAll(){
  if(!confirm('سيتم حذف جميع الأفراد والاشتراكات نهائياً. هل أنت متأكد؟')) return;
  if(!confirm('تأكيد نهائي: حذف كل شيء؟')) return;
  members = [];
  saveData();
  refreshStats();
  renderMembers();
  buildAllSubsText();
  toast('🗑️ تم حذف جميع البيانات');
}

/* ==================== تشغيل ==================== */
window.addEventListener('DOMContentLoaded', ()=>{
  refreshStats();
  renderMembers();
  showView('home');
});
</script>

</body>
</html>
