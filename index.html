<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مطور نصوص يونيتي الاحترافي V2</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cairo:wght@900&family=Lalezar&display=swap" rel="stylesheet">
    <style>
        body{background:#0b0f19;color:#f8fafc;font-family:'Cairo','Arial Black',sans-serif;text-align:center;padding:20px}
        .container{max-width:1000px;margin:auto;background:#151f32;padding:25px;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,0.5);display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
        .controls{display:flex;flex-direction:column;gap:12px;background:rgba(0,0,0,0.2);padding:15px;border-radius:12px}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .form-group{display:flex;flex-direction:column;gap:5px;text-align:right}
        input,select{padding:10px;border-radius:6px;border:1px solid #334155;background:#0b0f19;color:white;font-family:inherit}
        .color-group{display:flex;align-items:center;gap:8px;background:#0b0f19;padding:4px 8px;border-radius:6px;border:1px solid #334155}
        input[type="color"]{border:none;width:30px;height:30px;cursor:pointer;background:none}
        .preview-area{background-image:linear-gradient(45deg,#1e293b 25%,transparent 25%),linear-gradient(-45deg,#1e293b 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1e293b 75%),linear-gradient(-45deg,transparent 75%,#1e293b 75%);background-size:20px 20px;border-radius:12px;border:2px dashed #334155;min-height:280px;display:flex;align-items:center;justify-content:center;overflow:auto;box-sizing:border-box}
        canvas{max-width:100%;height:auto}
        .btn-download{background:linear-gradient(135deg,#22c55e 0%,#16a34a 100%);color:white;border:none;padding:14px;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 4px 15px rgba(34,197,94,0.3);width:100%}
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <div class="form-group"><label>النص:</label><input type="text" id="textInput" value="مستوى جديد"></div>
            <div class="form-row">
                <div class="form-group"><label>الخط:</label><select id="fontSelect"><option value="Cairo">القاهرة</option><option value="Lalezar">بازار</option></select></div>
                <div class="form-group"><label>الحجم:</label><input type="number" id="fontSize" value="90"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>لون الكلمة الأساسي:</label><div class="color-group"><input type="color" id="textColor" value="#ffffff"><span id="textColorHex">#ffffff</span></div></div>
                <div class="form-group"><label>لون الحواف (Stroke):</label><div class="color-group"><input type="color" id="strokeColor" value="#0f172a"><span id="strokeColorHex">#0f172a</span></div></div>
            </div>
            <div class="form-group"><label>سُمك الحواف:</label><input type="number" id="strokeWidth" value="8"></div>
            <button class="btn-download" id="downloadBtn">تحميل الصورة PNG الشفافة</button>
        </div>
        <div class="preview-area"><canvas id="textCanvas"></canvas></div>
    </div>
    <script>
        const canvas=document.getElementById('textCanvas'),ctx=canvas.getContext('2d');
        const textInput=document.getElementById('textInput'),fontSelect=document.getElementById('fontSelect'),fontSizeInput=document.getElementById('fontSize'),textColor=document.getElementById('textColor'),strokeColor=document.getElementById('strokeColor'),strokeWidthInput=document.getElementById('strokeWidth'),textColorHex=document.getElementById('textColorHex'),strokeColorHex=document.getElementById('strokeColorHex'),downloadBtn=document.getElementById('downloadBtn');
        
        function updateCanvas(){
            const t=textInput.value||" ",f=fontSelect.value,s=parseInt(fontSizeInput.value)||50,w=parseInt(strokeWidthInput.value)||0;
            textColorHex.innerText=textColor.value;strokeColorHex.innerText=strokeColor.value;
            ctx.font=`900 ${s}px '${f}','Arial Black',sans-serif`;
            const m=ctx.measureText(t),extra=(w*2)+60;
            canvas.width=Math.ceil(m.width)+extra;canvas.height=s*1.6+extra;
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.font=`900 ${s}px '${f}','Arial Black',sans-serif`;ctx.textBaseline='middle';ctx.textAlign='center';
            const x=canvas.width/2,y=canvas.height/2;
            if(w>0){ctx.strokeStyle=strokeColor.value;ctx.lineWidth=w;ctx.lineJoin='round';ctx.strokeText(t,x,y)}
            ctx.fillStyle=textColor.value;ctx.fillText(t,x,y);
        }
        [textInput,fontSelect,fontSizeInput,textColor,strokeColor,strokeWidthInput].forEach(i=>{i.addEventListener('input',updateCanvas);i.addEventListener('change',updateCanvas)});
        window.onload=function(){updateCanvas();setTimeout(updateCanvas,100)};
        updateCanvas();
        downloadBtn.addEventListener('click',()=>{
            const t=textInput.value.trim()||'unity-text',l=document.createElement('a');
            l.download=`${t}.png`;l.href=canvas.toDataURL('image/png');l.click();
        });
    </script>
</body>
</html>
