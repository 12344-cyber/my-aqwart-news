<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Mihnah Renderer</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
  .box { text-align: center; max-width: 600px; background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .bar { height: 12px; background: #334155; border-radius: 6px; margin: 20px 0; overflow: hidden; }
  .fill { height: 100%; background: linear-gradient(90deg, #3fe890, #60f8b0); width: 0%; transition: width 0.4s ease; }
  h2 { margin-bottom: 10px; font-size: 1.5rem; }
  p { color: #94a3b8; font-size: 0.95rem; margin: 5px 0; }
  .error { color: #ef4444; margin-top: 15px; padding: 15px; background: rgba(239,68,68,0.1); border-radius: 8px; display: none; }
  .small { font-size: 0.8rem; color: #64748b; margin-top: 10px; }
</style>
</head>
<body>
<div class="box">
  <h2 id="status">🔄 جاري تحميل المحرك...</h2>
  <p id="detail">يرجى الانتظار، قد يستغرق 10-30 ثانية</p>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div id="error" class="error"></div>
  <p class="small" id="isolation"></p>
</div>

<script type="module">
import { FFmpeg } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
import { toBlobURL } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js';

const WORKER = 'https://video-builder-proxy.mhhj032009.workers.dev';
let ffmpeg = null;

// عرض حالة العزل للمساعدة في التشخيص
document.getElementById('isolation').textContent =
  self.crossOriginIsolated
    ? '✅ الصفحة معزولة عبر الأصل (SharedArrayBuffer متاح)'
    : '⚠️ الصفحة غير معزولة (سأستخدم النسخة أحادية الخيط)';

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = '❌ ' + msg;
  el.style.display = 'block';
  document.getElementById('status').textContent = 'فشل التحميل';
  document.getElementById('detail').textContent = 'راجع الخطأ أدناه';
}

// إشارة الجاهزية لبلوجر
function signalReady() {
  parent.postMessage({ action: 'iframe-active' }, '*');
  startRender();
}

// بدء الاستماع لأوامر التصيير
function startRender() {
  window.addEventListener('message', async (e) => {
    if (e.data?.action === 'render') {
      await runRender(e.data.project);
    }
  });
}

// محاولة التحميل مع مؤقت للكشف عن التعليق
async function initFFmpeg() {
  const statusEl = document.getElementById('status');
  const detailEl = document.getElementById('detail');

  statusEl.textContent = '⏳ تحميل النواة...';
  detailEl.textContent = 'جاري تحميل ملفات FFmpeg الأساسية';

  // النسخة أحادية الخيط: @ffmpeg/core (وليس core-mt)
  const baseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm';

  ffmpeg = new FFmpeg();

  // مراقبة السجلات للكشف عن أخطاء التحميل
  ffmpeg.on('log', ({ message }) => {
    console.log('[FFmpeg]', message);
    if (message.includes('worker') || message.includes('load')) {
      detailEl.textContent = 'تحميل: ' + message.slice(0, 80);
    }
  });

  // مؤقت أمان: إذا تجاوز التحميل 25 ثانية، أظهر خطأ
  const timeout = setTimeout(() => {
    if (!ffmpeg.loaded) {
      showError('انتهت مهلة تحميل FFmpeg (25 ثانية). قد يكون CDN محظورًا أو الشبكة بطيئة. جرّب تحديث الصفحة.');
    }
  }, 25000);

  try {
    await ffmpeg.load({
      coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
      wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
    });

    clearTimeout(timeout);

    if (!ffmpeg.loaded) {
      throw new Error('لم يتم تحميل FFmpeg بشكل كامل (loaded = false)');
    }

    document.getElementById('fill').style.width = '100%';
    statusEl.textContent = '✅ المحرك جاهز';
    detailEl.textContent = 'بانتظار أوامر التصيير';
    signalReady();

  } catch (err) {
    clearTimeout(timeout);
    console.error('FFmpeg load error:', err);
    showError(err.message || 'فشل غير معروف أثناء تحميل FFmpeg');
  }
}

// بدء التحميل فورًا
initFFmpeg();

// ---------- دوال التصيير (كما هي، مع تعديلات طفيفة) ----------
function updateUI(status, detail, pct) {
  document.getElementById('status').textContent = status;
  document.getElementById('detail').textContent = detail;
  document.getElementById('fill').style.width = `${pct}%`;
  parent.postMessage({ action: 'progress', percent: pct, status, detail }, '*');
}

async function runRender(project) {
  if (!ffmpeg || !ffmpeg.loaded) {
    parent.postMessage({ action: 'render-error', error: 'FFmpeg غير جاهز' }, '*');
    return;
  }

  try {
    updateUI('⏳ تجهيز المشاهد...', 'جاري التهيئة', 5);

    const scenes = project.scenes || [];
    if (!scenes.length) throw new Error('لا توجد مشاهد');

    // 1. توليد الأصوات
    updateUI('🔊 جاري توليد الأصوات...', `0 / ${scenes.length}`, 15);
    for (let i = 0; i < scenes.length; i++) {
      const sc = scenes[i];
      const res = await fetch(`${WORKER}/api/tts`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ text: sc.text, voice: sc.voice || 'ar-SA-ZariyahNeural', rate: 1.0 })
      });
      if (!res.ok) throw new Error(`فشل الصوت ${i+1}`);
      await ffmpeg.writeFile(`a${i}.wav`, new Uint8Array(await res.arrayBuffer()));
      updateUI('🔊 الأصوات...', `${i+1}/${scenes.length}`, 15 + (i/scenes.length)*20);
    }

    // 2. تحميل الوسائط
    updateUI('🖼️ تحميل الخلفيات...', '0%', 40);
    for (let i = 0; i < scenes.length; i++) {
      const sc = scenes[i];
      if (sc.mediaUrl) {
        try {
          const r = await fetch(sc.mediaUrl);
          const b = await r.blob();
          const ext = sc.mediaType === 'video' ? 'mp4' : 'jpg';
          await ffmpeg.writeFile(`m${i}.${ext}`, new Uint8Array(await b.arrayBuffer()));
        } catch {
          await writeBlackFrame(i);
        }
      } else {
        await writeBlackFrame(i);
      }
      updateUI('🖼️ الخلفيات...', `${i+1}/${scenes.length}`, 40 + (i/scenes.length)*20);
    }

    // 3. دمج المشاهد
    updateUI('🎬 دمج المشاهد...', '0%', 70);
    let listContent = '';
    for (let i = 0; i < scenes.length; i++) {
      const sc = scenes[i];
      const isVid = sc.mediaType === 'video' && sc.mediaUrl;
      const ext = isVid ? 'mp4' : 'jpg';

      await ffmpeg.exec([
        '-y',
        '-i', `m${i}.${ext}`,
        '-i', `a${i}.wav`,
        '-c:v', 'libx264', '-preset', 'veryfast',
        '-c:a', 'aac',
        '-t', String(sc.duration || 5),
        '-shortest',
        '-pix_fmt', 'yuv420p',
        '-vf', isVid ? 'scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2' : 'scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720',
        `scene${i}.mp4`
      ]);

      listContent += `file 'scene${i}.mp4'\n`;
      updateUI('🎬 الدمج...', `${i+1}/${scenes.length}`, 70 + (i/scenes.length)*20);
    }

    // 4. الدمج النهائي
    updateUI('🔗 تجميع الفيديو...', '90%', 90);
    await ffmpeg.writeFile('list.txt', listContent);
    await ffmpeg.exec(['-f', 'concat', '-safe', '0', '-i', 'list.txt', '-c', 'copy', 'final.mp4']);

    // 5. الإرسال
    updateUI('💾 الحفظ...', '95%', 95);
    const data = await ffmpeg.readFile('final.mp4');
    const blob = new Blob([data.buffer], { type: 'video/mp4' });
    const url = URL.createObjectURL(blob);

    updateUI('✅ تم!', '100%', 100);
    parent.postMessage({ action: 'render-complete', videoUrl: url }, '*');

  } catch (err) {
    console.error(err);
    showError(err.message);
    parent.postMessage({ action: 'render-error', error: err.message }, '*');
  }
}

async function writeBlackFrame(i) {
  const c = document.createElement('canvas'); c.width = 1280; c.height = 720;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1280, 720);
  const d = c.toDataURL('image/jpeg').split(',')[1];
  const bin = atob(d); const arr = new Uint8Array(bin.length);
  for (let j = 0; j < bin.length; j++) arr[j] = bin.charCodeAt(j);
  await ffmpeg.writeFile(`m${i}.jpg`, arr);
}
</script>
</body>
</html>
