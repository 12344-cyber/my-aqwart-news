<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aje ajmar - فيديو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{background:#021533;font-family:Cairo,sans-serif;padding:10px;color:#fff;margin:0}
.box{max-width:900px;margin:auto}
.card{background:#081a33;padding:14px;border-radius:14px;border:1px solid #164a6b;margin-bottom:10px}
h3{color:#00e5ff;margin:8px 0}
label{display:block;font-size:13px;margin:8px 0 4px;color:#b8d0e8}
input[type=text],select{width:100%;padding:11px;border-radius:10px;border:1px solid #164a6b;background:#04122a;color:#fff;font-family:Cairo,sans-serif}
input[type=file]{width:100%;padding:8px;background:#04122a;border-radius:10px}
input[type=range]{width:100%;accent-color:#00e5ff}
button{padding:13px;border:none;border-radius:12px;font-weight:900;font-family:Cairo,sans-serif;cursor:pointer;font-size:15px;width:100%;margin-top:8px}
.b1{background:#00e5ff;color:#021533}.b2{background:#9c27b0;color:#fff}.b3{background:#ff4757;color:#fff}
canvas{width:100%;border-radius:12px;background:#000;display:block}
.status{padding:10px;border-radius:10px;text-align:center;font-size:13px;font-weight:700;margin-top:10px;background:#04122a;border:1px solid #164a6b}
.ok{color:#00e5ff}.err{color:#ff4757}.busy{color:#ffc107}
.timer{text-align:center;font-size:28px;font-weight:900;color:#ff4757;display:none}.timer.show{display:block}
#realVideo{width:100%;border-radius:12px;background:#000;display:block;margin-top:8px}
#realAudio{width:100%;border-radius:12px;display:none;margin-top:8px}
</style>
</head>
<body>
<div class="box">
<div class="card">
<h3>1 - ارفع الفيديو أو الصورة</h3>
<input type="file" id="videoUp" accept="video/*">
<video id="realVideo" playsinline controls muted></video>
<div id="debug" style="text-align:center;font-size:13px;color:#ffc107;margin-top:6px">بانتظار رفع الفيديو...</div>
<label>نص الخبر (السطر الأول أبيض والباقي أزرق)</label><input type="text" id="fullText" value="رئيس الجمهوريه يتوجه الي تركيا ويودع من قبل وزير الداخلية" maxlength="110">
<label>الهاتف</label><input type="text" id="phoneText" value="26361821">
<label>شعار الصفحة - يظهر في الأعلى على اليمين فقط</label><input type="file" id="logoUp" accept="image/*">
<label>صورة (اختياري - بدل الفيديو)</label><input type="file" id="imgUp" accept="image/*">
<label>صوت (اختياري - لدمجه مع الصورة)</label><input type="file" id="audioUp" accept="audio/*">
<audio id="realAudio" controls></audio>
<label>📐 جودة الإخراج</label>
<select id="resSel">
<option value="720">720 - أسرع وأثبت (مُوصى به للهاتف)</option>
<option value="1080">1080 - أعلى جودة (يحتاج هاتفًا قويًا)</option>
</select>
<label>🔊 قوة الصوت: <span id="volVal">2.5×</span></label>
<input type="range" id="vidVol" min="1" max="6" step="0.5" value="2.5">
<button class="b2" id="btnStart">🎬 بدء التسجيل</button>
<button class="b3" id="btnStop" style="display:none">⏹️ إيقاف التسجيل</button>
<div class="timer" id="timer">00:00</div>
<button class="b1" id="btnDownload" style="display:none">⬇️ تحميل الفيديو</button>
<div class="status" id="status">ارفع الفيديو أو الصورة ثم اضغط تسجيل</div>
</div>
<div class="card"><h3>2 - المعاينة</h3><canvas id="c" width="720" height="720"></canvas></div>
</div>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script>
const $=id=>document.getElementById(id);
const W=1600,CY='#00e5ff';
let CW=720,S=CW/W;
const cv=$('c'), mctx=cv.getContext('2d',{alpha:false});
const sc=document.createElement('canvas'); sc.width=sc.height=CW; const sctx=sc.getContext('2d');
let x=mctx;
const videoEl=$('realVideo'), audioEl=$('realAudio'), statusEl=$('status'), timerEl=$('timer');
let img=null, logoImg=null, videoReady=false, soundOn=true, dirty=true;
let audioReady=false, audioSrcMade=false, audioGain=null;
let isRecording=false, recorder=null, chunks=[], stream=null, timerInt=null, startTime=0, lastDraw=0;
let stopNote='', lastVT=0, lastVTime=0;
let ffmpeg = null;
const { fetchFile } = FFmpegUtil;
async function loadFFmpeg() {
  if (ffmpeg) return ffmpeg;
  setStatus('busy','⏳ جاري تحميل محول الفيديو...');
  ffmpeg = new FFmpeg();
  const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
  await ffmpeg.load({
    coreURL: await FFmpegUtil.toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
    wasmURL: await FFmpegUtil.toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
  });
  return ffmpeg;
}
function setStatus(cls,msg){statusEl.className='status '+cls; statusEl.innerHTML=msg;}
function setRes(n){ CW=n; S=CW/W; cv.width=cv.height=CW; sc.width=sc.height=CW; dirty=true; }
$('resSel').addEventListener('change',e=>{ if(isRecording){ e.target.value=String(CW); return; } setRes(parseInt(e.target.value)); });
function rr(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.lineTo(a+w-r,b);x.quadraticCurveTo(a+w,b,a+w,b+r);x.lineTo(a+w,b+h-r);x.quadraticCurveTo(a+w,b+h,a+w-r,b+h);x.lineTo(a+r,b+h);x.quadraticCurveTo(a,b+h,a,b+h-r);x.lineTo(a,b+r);x.quadraticCurveTo(a,b,a+r,b);x.closePath();}
function glow(c,b){x.shadowColor=c;x.shadowBlur=b;}
function noGlow(){x.shadowBlur=0;x.shadowColor='transparent';}
function person(cx,cy,s){
  let g=x.createLinearGradient(0,cy-s/2,0,cy+s/2);g.addColorStop(0,'#35e0ff');g.addColorStop(1,'#00a9e8');
  x.fillStyle=g;
  x.beginPath();x.arc(cx,cy-s*0.2,s*0.26,0,Math.PI*2);x.fill();
  x.beginPath();x.moveTo(cx-s*0.5,cy+s*0.5);
  x.bezierCurveTo(cx-s*0.5,cy+s*0.12,cx-s*0.3,cy+s*0.1,cx,cy+s*0.1);
  x.bezierCurveTo(cx+s*0.3,cy+s*0.1,cx+s*0.5,cy+s*0.12,cx+s*0.5,cy+s*0.5);
  x.closePath();x.fill();
}
function logoTopRight(){
  let s=130, cx=W-85, cy=85;
  if(logoImg){
    let r=s/2;
    x.save();x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.clip();
    let m=Math.min(logoImg.width,logoImg.height);
    x.drawImage(logoImg,(logoImg.width-m)/2,(logoImg.height-m)/2,m,m,cx-r,cy-r,s,s);
    x.restore();
    x.save();noGlow();x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.strokeStyle=CY;x.lineWidth=4;x.stroke();x.restore();
  }else{
    person(cx,cy,s);
    x.beginPath();x.arc(cx,cy,s/2,0,Math.PI*2);x.strokeStyle=CY;x.lineWidth=4;x.stroke();
  }
}
function circleIcon(cx,cy){
  x.beginPath();x.arc(cx,cy,35,0,Math.PI*2);
  x.fillStyle='rgba(0,229,255,0.12)';x.fill();
  x.save();glow(CY,10);x.strokeStyle=CY;x.lineWidth=3;x.stroke();x.restore();
}
function iconFB(cx,cy){circleIcon(cx,cy);x.fillStyle='#fff';x.font='900 50px Cairo, Arial, sans-serif';x.textAlign='center';x.textBaseline='middle';x.direction='ltr';x.fillText('f',cx+2,cy+6);}
function iconIG(cx,cy){circleIcon(cx,cy);x.strokeStyle='#fff';x.lineWidth=3.5;rr(cx-16,cy-16,32,32,9);x.stroke();x.beginPath();x.arc(cx,cy,7.5,0,Math.PI*2);x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(cx+10,cy-10,2.4,0,Math.PI*2);x.fill();}
function iconYT(cx,cy){circleIcon(cx,cy);x.fillStyle='#fff';rr(cx-21,cy-15,42,30,9);x.fill();x.fillStyle='#0a3a5e';x.beginPath();x.moveTo(cx-6,cy-8);x.lineTo(cx+9,cy);x.lineTo(cx-6,cy+8);x.closePath();x.fill();}
function iconTT(cx,cy){
  circleIcon(cx,cy);x.lineCap='round';x.lineJoin='round';
  function note(dx,dy,c){x.strokeStyle=c;x.lineWidth=5.5;x.beginPath();x.moveTo(cx+4+dx,cy-17+dy);x.lineTo(cx+4+dx,cy+8+dy);x.stroke();x.beginPath();x.arc(cx-3+dx,cy+9+dy,7.5,0,Math.PI*2);x.stroke();x.beginPath();x.moveTo(cx+4+dx,cy-17+dy);x.quadraticCurveTo(cx+6+dx,cy-8+dy,cx+16+dx,cy-8+dy);x.stroke();}
  note(-2,1,'#00e5ff');note(0,0,'#fff');x.lineCap='butt';
}
function trace(pts){
  x.save();x.strokeStyle='rgba(0,229,255,0.45)';x.lineWidth=2;glow(CY,8);x.beginPath();x.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)x.lineTo(pts[i][0],pts[i][1]);x.stroke();
  x.fillStyle=CY;[pts[0],pts[pts.length-1]].forEach(p=>{x.beginPath();x.arc(p[0],p[1],4,0,Math.PI*2);x.fill();});x.restore();
}
function wrap(text,maxW,fs){
  x.font='900 '+fs+'px Cairo, sans-serif';
  let words=text.split(/\s+/).filter(Boolean),lines=[],cur='';
  for(let w of words){let t=cur?cur+' '+w:w;if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);return lines;
}
function renderStatic(){
  x=sctx; x.setTransform(S,0,0,S,0,0); x.clearRect(0,0,W,W);
  let g=x.createLinearGradient(0,0,0,W);g.addColorStop(0,'#071c3f');g.addColorStop(1,'#020b20');
  x.fillStyle=g;x.fillRect(0,0,W,W);
  x.save();x.strokeStyle='rgba(0,229,255,0.06)';x.lineWidth=1;
  for(let i=0;i<=W;i+=50){x.beginPath();x.moveTo(i,0);x.lineTo(i,W);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke();}
  x.restore();
  trace([[32,300],[32,1000]]);trace([[52,420],[52,560],[34,580]]);trace([[10,1180],[10,1420]]);
  trace([[1568,330],[1568,1000]]);trace([[1548,430],[1548,640],[1566,660]]);trace([[1590,1150],[1590,1400]]);
  trace([[30,1370],[110,1370],[150,1410],[420,1410]]);trace([[1570,1360],[1480,1360],[1440,1400],[1250,1400]]);
  trace([[40,120],[100,120],[140,80]]);trace([[1560,120],[1520,120],[1490,160]]);
  x.save();glow(CY,12);x.strokeStyle='rgba(0,229,255,0.5)';x.lineWidth=3;rr(8,8,W-16,W-16,26);x.stroke();x.restore();
  x.fillStyle='#000';x.fillRect(10,10,1580,1118);
  x.save();noGlow();x.strokeStyle='rgba(0,229,255,0.25)';x.lineWidth=0.5;x.strokeRect(10,10,1580,1118);x.restore();
  // الشعار لا يرسم هنا - لأنه سيتغطى بالفيديو
  let nx=28,ny=1132,nw=1544,nh=313;
  x.save();rr(nx,ny,nw,nh,16);
  let ng=x.createLinearGradient(0,ny,0,ny+nh);ng.addColorStop(0,'#061836');ng.addColorStop(1,'#04122c');
  x.fillStyle=ng;x.fill();glow(CY,10);x.strokeStyle='rgba(0,229,255,0.7)';x.lineWidth=2.5;x.stroke();x.restore();
  let h1=$('fullText').value.slice(0,110).trim(),fs=92,lines=[];
  if(h1){
    for(fs=92;fs>=56;fs-=4){lines=wrap(h1,1380,fs);if(lines.length<=2)break;}
    if(lines.length>3)lines=lines.slice(0,3);
    let lh=fs*1.28,top=ny+(nh-lines.length*lh)/2+lh/2+4;
    x.font='900 '+fs+'px Cairo, sans-serif';x.direction='rtl';x.textAlign='center';x.textBaseline='middle';
    lines.forEach((l,i)=>{
      x.save();
      if(i==0){x.fillStyle='#fff';glow('rgba(255,255,255,0.35)',6);}
      else{let tg=x.createLinearGradient(300,0,1300,0);tg.addColorStop(0,'#1ea8ff');tg.addColorStop(1,'#10c0ff');x.fillStyle=tg;}
      x.fillText(l,W/2,top+i*lh);x.restore();
    });
  }
  x.save();rr(50,1470,1500,100,50);x.fillStyle='rgba(2,10,29,.96)';x.fill();glow(CY,14);x.strokeStyle=CY;x.lineWidth=3;x.stroke();x.restore();
  let cy=1520;
  iconFB(187,cy);iconIG(289,cy);iconYT(390,cy);iconTT(490,cy);
  x.font='900 46px Cairo, sans-serif';x.direction='ltr';x.textAlign='center';x.textBaseline='middle';
  x.save();glow(CY,10);x.fillStyle='#35dcff';x.fillText($('phoneText').value||'26361821',1390,cy+2);x.restore();
  x.setTransform(1,0,0,1,0,0);x=mctx;
}
function coverDraw(src,vw,vh){
  const ix=10,iy=10,iw=1580,ih=1118,va=vw/vh,ta=iw/ih;
  let sw=vw,sh=vh,sx=0,sy=0;
  if(va>ta){sw=vh*ta;sx=(vw-sw)/2;}else{sh=vw/ta;sy=(vh-sh)/2;}
  x.save();x.beginPath();x.rect(ix,iy,iw,ih);x.clip();x.drawImage(src,sx,sy,sw,sh,ix,iy,iw,ih);x.restore();
}
function draw(){
  if(dirty){dirty=false;$('fullText').value=$('fullText').value.slice(0,110);renderStatic();}
  x=mctx;x.setTransform(1,0,0,1,0,0);x.drawImage(sc,0,0);
  x.setTransform(S,0,0,S,0,0);
  let drew=false;
  if(img){coverDraw(img,img.naturalWidth,img.naturalHeight);drew=true;}
  else if(videoReady&&videoEl.readyState>=2&&videoEl.videoWidth>0){
    if(videoEl.paused&&isRecording&&!videoEl.ended)videoEl.play().catch(()=>{});
    try{coverDraw(videoEl,videoEl.videoWidth,videoEl.videoHeight);drew=true;}catch(e){}
    $('debug').textContent='الفيديو: '+videoEl.currentTime.toFixed(1)+' ث / '+videoEl.duration.toFixed(1)+' ث';
  }
  if(!drew){x.fillStyle='#7a9bbf';x.font='900 46px Cairo, sans-serif';x.direction='rtl';x.textAlign='center';x.textBaseline='middle';x.fillText('📹 ارفع فيديو أو صورة',800,570);}
  // الشعار فوق الفيديو - هنا هو الصح
  logoTopRight();
  x.setTransform(1,0,0,1,0,0);
}
function loop(ts){
  requestAnimationFrame(loop);
  if(ts-lastDraw<40)return; lastDraw=ts; draw();
  if(isRecording&&stream){const tr=stream.getVideoTracks()[0]; if(tr&&tr.requestFrame)tr.requestFrame();}
  if(isRecording&&videoReady&&!img){
    const t=videoEl.currentTime;
    if(Math.abs(t-lastVT)>0.05){lastVT=t;lastVTime=ts;}
    else if(!videoEl.ended&&ts-lastVTime>10000){ stopNote='<br>⚠️ توقف الفيديو'; stopRecording(); }
    if(videoEl.duration&&t>=videoEl.duration-0.15) stopRecording();
  }
  if(isRecording && img && audioReady && !videoReady){
    if(audioEl.ended) stopRecording();
    else if(audioEl.duration && audioEl.currentTime >= audioEl.duration-0.15) stopRecording();
  }
}
requestAnimationFrame(loop);
['fullText','phoneText'].forEach(id=>$(id).addEventListener('input',()=>dirty=true));
(async()=>{try{await Promise.all([document.fonts.load('900 80px Cairo','أجه آجمار')]);}catch(e){} dirty=true;})();
let actx=null, gainNode=null, audioDest=null, videoSrcMade=false, boost=2.5;
function ensureCtx(){ if(actx) return true; try{ actx=new (window.AudioContext||window.webkitAudioContext)(); audioDest=actx.createMediaStreamDestination(); return true; }catch(e){ return false; } }
function setupAudio(){ if(!ensureCtx()) return; if(videoSrcMade) return; try{ const src=actx.createMediaElementSource(videoEl); gainNode=actx.createGain(); gainNode.gain.value=boost; const comp=actx.createDynamicsCompressor(); src.connect(gainNode); gainNode.connect(comp); comp.connect(audioDest); src.connect(actx.destination); videoSrcMade=true; }catch(e){} }
function setupAudioFile(){ if(!ensureCtx()) return; if(audioSrcMade) return; try{ const src=actx.createMediaElementSource(audioEl); audioGain=actx.createGain(); audioGain.gain.value=boost; const comp=actx.createDynamicsCompressor(); src.connect(audioGain); audioGain.connect(comp); comp.connect(audioDest); src.connect(actx.destination); audioSrcMade=true; }catch(e){} }
$('vidVol').addEventListener('input',e=>{ boost=parseFloat(e.target.value); $('volVal').textContent=boost.toFixed(1)+'×'; if(gainNode) gainNode.gain.value=boost; if(audioGain) audioGain.gain.value=boost; });
$('logoUp').addEventListener('change',e=>{ const f=e.target.files[0];if(!f)return; const im=new Image();im.onload=()=>{logoImg=im;dirty=true;};im.src=URL.createObjectURL(f); });
$('videoUp').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; img=null; videoReady=false; videoEl.src=URL.createObjectURL(f); videoEl.load(); videoEl.onloadedmetadata=()=>{ videoReady=true; videoEl.currentTime=0; videoEl.play().catch(()=>{}); }; });
$('imgUp').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const im=new Image(); im.onload=()=>{ img=im; videoReady=false; videoEl.pause(); }; im.src=URL.createObjectURL(f); });
$('audioUp').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; audioEl.src = URL.createObjectURL(f); audioEl.load(); audioEl.onloadedmetadata = () => { audioReady = true; audioEl.style.display = 'block'; }; });
function stopRecording(){ if(!isRecording) return; setStatus('busy','⏳ جاري تجهيز التسجيل...'); try{ if(recorder && recorder.state!=='inactive') recorder.stop(); }catch(e){} try{ if(audioReady && !audioEl.paused) audioEl.pause(); }catch(e){} }
videoEl.addEventListener('ended',()=>{ if(isRecording) stopRecording(); });
function startTimer(){ startTime=Date.now(); timerEl.classList.add('show'); timerInt=setInterval(()=>{const s=Math.floor((Date.now()-startTime)/1000); timerEl.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');},500); }
function stopTimer(){ clearInterval(timerInt); timerEl.classList.remove('show'); }
async function convertToMp4(webmBlob) {
  try {
    const ff = await loadFFmpeg();
    setStatus('busy', '⏳ جاري تحويل الفيديو إلى MP4...');
    await ff.writeFile('input.webm', await fetchFile(webmBlob));
    await ff.exec(['-i','input.webm','-c:v','libx264','-preset','ultrafast','-crf','23','-pix_fmt','yuv420p','-c:a','aac','-b:a','128k','-movflags','+faststart','output.mp4']);
    const data = await ff.readFile('output.mp4');
    await ff.deleteFile('input.webm'); await ff.deleteFile('output.mp4');
    return new Blob([data.buffer], { type: 'video/mp4' });
  } catch (err) { throw new Error('فشل التحويل'); }
}
$('btnStart').addEventListener('click',async()=>{
  if(isRecording) return;
  if(!videoReady && !img){ setStatus('err','⚠️ ارفع الفيديو أو الصورة أولاً'); return; }
  try{
    stopNote='';
    if(videoReady){ videoEl.muted=false; videoEl.volume=1; setupAudio(); if(actx && actx.state==='suspended') await actx.resume(); videoEl.currentTime=0; await videoEl.play(); }
    else if(img && audioReady){ audioEl.muted=false; audioEl.volume=1; setupAudioFile(); if(actx && actx.state==='suspended') await actx.resume(); audioEl.currentTime=0; await audioEl.play(); }
    draw(); stream = cv.captureStream(25);
    let tracks=[...stream.getVideoTracks()];
    if(videoReady && soundOn && audioDest){ const at=audioDest.stream.getAudioTracks(); if(at.length) tracks.push(at[0]); }
    else if(img && audioReady && soundOn && audioDest){ const at=audioDest.stream.getAudioTracks(); if(at.length) tracks.push(at[0]); }
    let mime=''; const list=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp8,opus','video/webm'];
    for(const m of list){ if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)){ mime=m; break; } }
    const opts={videoBitsPerSecond:(CW>=1080?3500000:2000000),audioBitsPerSecond:128000}; if(mime) opts.mimeType=mime;
    recorder = new MediaRecorder(new MediaStream(tracks), opts);
    chunks=[]; recorder.ondataavailable=e=>{ if(e.data && e.data.size>0) chunks.push(e.data); };
    recorder.onstop=async()=>{
      stopTimer(); isRecording=false; $('resSel').disabled=false;
      if(!chunks.length){ setStatus('err','⚠️ لم يتم التسجيل'); $('btnStart').style.display='block'; $('btnStop').style.display='none'; return; }
      let blob = new Blob(chunks, {type: mime || 'video/webm'});
      let finalMime = mime || 'video/webm';
      if (finalMime.includes('webm') || !finalMime.includes('mp4')) {
        try { blob = await convertToMp4(blob); finalMime = 'video/mp4'; } catch(e){ setStatus('err','⚠️ فشل التحويل'); window._lastBlob = blob; window._lastMime = finalMime; $('btnDownload').style.display='block'; $('btnStart').style.display='block'; $('btnStop').style.display='none'; return; }
      }
      window._lastBlob = blob; window._lastMime = finalMime;
      setStatus('ok','✅ تم التسجيل - اضغط تحميل');
      $('btnDownload').style.display = 'block'; $('btnStart').style.display = 'block'; $('btnStop').style.display = 'none';
    };
    recorder.start(500); isRecording=true; startTimer();
    lastVT=videoEl.currentTime; lastVTime=performance.now();
    $('resSel').disabled=true;
    $('btnStart').style.display='none'; $('btnStop').style.display='block'; $('btnDownload').style.display='none';
    setStatus('busy','🔴 جاري التسجيل...');
  }catch(err){ setStatus('err','⚠️ اضغط زر تشغيل ▶️ في الفيديو فوق أولاً ثم اضغط تسجيل'); }
});
$('btnStop').addEventListener('click',stopRecording);
$('btnDownload').addEventListener('click',()=>{
  const blob=window._lastBlob; if(!blob) return;
  let ext = 'webm'; if (window._lastMime && window._lastMime.includes('mp4')) ext = 'mp4';
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='aje_ajmar_'+Date.now()+'.'+ext; a.click();
});
window.addEventListener('beforeunload',e=>{ if(isRecording){ e.preventDefault(); e.returnValue='التسجيل جارٍ'; }});
</script>
</body>
</html>
